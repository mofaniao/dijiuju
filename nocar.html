<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>一键挪车</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="shortcut icon" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="msapplication-TileImage" content="favicon.svg">
<meta name="msapplication-TileColor" content="#6c5ce7">
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
<style>
  :root { --radius: 14px; --radius-sm: 10px; }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
    min-height: 100dvh;
  }

  [data-theme="light"] {
    --bg: #f5f0eb;
    --card: rgba(255,255,255,0.85);
    --card-solid: #ffffff;
    --text: #2c2c2c;
    --sub: #888;
    --border: rgba(0,0,0,0.08);
    --accent: #6c5ce7;
    --accent-hover: #5a4bd1;
    --accent-glow: rgba(108,92,231,0.3);
    --danger: #e74c3c;
    --success: #27ae60;
    --shadow: 0 8px 32px rgba(0,0,0,0.08);
    --input-bg: rgba(0,0,0,0.03);
    --tag-bg: rgba(0,0,0,0.04);
    --tag-hl-bg: #f3f0ff;
    --item-border: rgba(0,0,0,0.06);
    --error-bg: #fef0ef;
    --success-bg: #eafaf1;
    --toast-bg: #333;
    --toast-text: #fff;
    --plate-bg: linear-gradient(135deg, #e8f5e9, #c8e6c9);
    --plate-border: #66bb6a;
    --plate-text: #1b5e20;
  }

  [data-theme="dark"] {
    --bg: #0f0f1a;
    --card: rgba(30,30,55,0.8);
    --card-solid: #1e1e37;
    --text: #e0e0e0;
    --sub: #888;
    --border: rgba(255,255,255,0.08);
    --accent: #a78bfa;
    --accent-hover: #c4b5fd;
    --accent-glow: rgba(167,139,250,0.3);
    --danger: #ff6b6b;
    --success: #4ecb71;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --input-bg: rgba(255,255,255,0.05);
    --tag-bg: rgba(255,255,255,0.06);
    --tag-hl-bg: rgba(167,139,250,0.15);
    --item-border: rgba(255,255,255,0.06);
    --error-bg: rgba(255,107,107,0.12);
    --success-bg: rgba(78,203,113,0.12);
    --toast-bg: #e0e0e0;
    --toast-text: #0f0f1a;
    --plate-bg: linear-gradient(135deg, #1b3a2b, #2e5e3e);
    --plate-border: #4e8c5e;
    --plate-text: #a5d6a7;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    transition: background .5s, color .5s;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 var(--accent-glow); }
    100% { box-shadow: 0 0 0 12px transparent; }
  }
  @keyframes carBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding: 14px 18px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .header .title { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .header-btns { display: flex; align-items: center; gap: 4px; }
  .icon-btn {
    background: none; border: none; font-size: 20px; cursor: pointer;
    padding: 4px 8px; border-radius: 8px; transition: all .2s;
    color: var(--text);
  }
  .icon-btn:hover { background: var(--tag-bg); }

  .back-btn {
    padding: 7px 16px;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    background: none;
    font-size: 13px;
    cursor: pointer;
    color: var(--sub);
    transition: all .2s;
    text-decoration: none;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px 20px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    border: 1px solid var(--border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    animation: fadeUp .5s ease-out;
    overflow: hidden;
  }
  .card h2 { font-size: 15px; margin-bottom: 14px; font-weight: 700; }

  /* Inputs */
  label.field-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--sub);
  }
  input[type="text"], input[type="tel"] {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 16px;
    font-family: inherit;
    outline: none;
    background: var(--input-bg);
    color: var(--text);
    transition: border .2s, background .35s;
    margin-bottom: 16px;
    -webkit-appearance: none;
  }
  input[type="text"]:focus, input[type="tel"]:focus {
    border-color: var(--accent);
    background: var(--card);
    box-shadow: 0 0 0 4px var(--accent-glow);
  }

  /* Plate input special style */
  .plate-input-wrap {
    position: relative;
    margin-bottom: 16px;
  }
  .plate-input-wrap input {
    text-align: center;
    letter-spacing: 2px;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 0;
  }
  .plate-preview {
    display: inline-block;
    padding: 10px 20px;
    background: var(--plate-bg);
    border: 2px solid var(--plate-border);
    border-radius: 8px;
    color: var(--plate-text);
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 3px;
    font-family: 'Courier New', monospace;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--accent), #a29bfe);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all .3s;
    position: relative;
    overflow: hidden;
  }
  .submit-btn::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
    opacity: 0; transition: opacity .3s;
  }
  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px var(--accent-glow); }
  .submit-btn:hover::after { opacity: 1; }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .secondary-btn {
    width: 100%;
    padding: 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    margin-top: 10px;
  }
  .secondary-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* QR Code area */
  .qr-area {
    text-align: center;
    padding: 20px 0;
  }
  .qr-area .qr-label {
    font-size: 14px;
    color: var(--sub);
    margin-bottom: 16px;
  }
  #qrcode {
    display: inline-block;
    padding: 10px;
    background: #fff;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  #qrcode img, #qrcode canvas {
    display: block;
  }
  .qr-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .qr-actions button {
    padding: 8px 20px;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    background: var(--card);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
  }
  .qr-actions button:hover { border-color: var(--accent); color: var(--accent); }

  /* Saved info display */
  .saved-info {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--input-bg);
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
    border: 1px solid var(--border);
  }
  .saved-info .label { font-size: 12px; color: var(--sub); }
  .saved-info .value { font-size: 15px; font-weight: 600; }

  /* Scanner minimal page */
  #scanner-section {
    background: #52ac39;
    min-height: 100dvh;
    max-width: 100%;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding-botom: 20dvh;
  }
  .scanner-hint {
    color: #fff;
    font-size: 50px;
    font-style: italic;
    font-weight: 600;
    letter-spacing: 4px;
    text-align: center;
    line-height: 1.6;
  }
  .scanner-plate {
    background: #1a6dd6;
    color: #fff;
    border-radius: 0;
    padding: 12px 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .scanner-plate .plate-province {
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
  }
  .scanner-plate .plate-dot {
    font-size: 18px;
    opacity: 0.7;
    line-height: 1;
    margin: 0 1px;
  }
  .scanner-plate .plate-num {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;
    line-height: 1;
  }
  .scanner-call-btn {
    background: #fff;
    color: #52ac39;
    font-size: 20px;
    font-weight: 700;
    padding: 16px 64px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 6px 24px rgba(0,0,0,0.15);
    transition: transform .2s, box-shadow .2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .scanner-call-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 36px rgba(0,0,0,0.25); }
  .scanner-call-btn:active { transform: translateY(0); }

  /* Toast */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: var(--toast-bg); color: var(--toast-text); padding: 12px 24px;
    border-radius: 24px; font-size: 13px; font-weight: 600; z-index: 999;
    opacity: 0; transition: all .3s cubic-bezier(.4,0,.2,1);
    pointer-events: none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    backdrop-filter: blur(10px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  .theme-fab {
    position: fixed; top: 20px; right: 20px;
    width: 44px; height: 44px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--card);
    box-shadow: var(--shadow);
    font-size: 20px; cursor: pointer; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    transition: all .3s cubic-bezier(.4,0,.2,1);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .theme-fab:hover { transform: scale(1.12) rotate(15deg); box-shadow: 0 4px 20px var(--accent-glow); }

  .empty { text-align: center; padding: 40px 20px; color: var(--sub); font-size: 15px; }
  .empty .big-emoji { font-size: 48px; display: block; margin-bottom: 10px; }

  /* Footer */
  .site-footer {
    text-align: center;
    padding: 16px 16px 20px;
    color: var(--sub);
    font-size: 12px;
    line-height: 1.6;
  }
  .site-footer a {
    color: var(--sub);
    text-decoration: none;
    transition: color .2s;
  }
  .site-footer a:hover { color: var(--accent); }

  /* Province picker */
  .province-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 12px;
  }
  .province-btn {
    padding: 6px 2px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--input-bg);
    font-size: 12px;
    cursor: pointer;
    transition: all .2s;
    color: var(--text);
    text-align: center;
  }
  .province-btn:hover { border-color: var(--accent); color: var(--accent); }
  .province-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 700;
  }

  /* Energy type selector */
  .energy-types {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .energy-btn {
    flex: 1;
    padding: 8px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--input-bg);
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
    color: var(--text);
    text-align: center;
  }
  .energy-btn:hover { border-color: var(--accent); }
  .energy-btn.active {
    border-color: var(--accent);
    background: var(--tag-hl-bg);
    color: var(--accent);
    font-weight: 700;
  }

  @media (max-width: 480px) {
    .app { padding: 16px 10px 60px; }
    .card { padding: 16px 14px; }
    .header { padding: 12px 14px; border-radius: var(--radius-sm); }
    .scanner-hero .car-icon { font-size: 60px; }
    .scanner-hero h1 { font-size: 20px; }
    .province-grid { grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .province-btn { font-size: 11px; padding: 5px 2px; }
  }
</style>
</head>
<body>

<!-- Owner Mode: Setup + QR Code -->
<div id="owner-section" class="app">
  <div class="header">
    <div class="title">🚗 一键挪车</div>
    <button class="back-btn theme-toggle" onclick="toggleTheme()">🌙</button>
  </div>

  <!-- Setup Card -->
  <div class="card" id="setup-card">
    <h2>设置挪车信息</h2>
    <p style="font-size:13px;color:var(--sub);margin-bottom:16px;">填写车牌和手机号，生成专属挪车二维码。扫码者只能看到脱敏手机号。</p>

    <!-- Province Picker -->
    <label class="field-label">选择省份简称</label>
    <div class="province-grid" id="province-grid"></div>

    <!-- Plate Number -->
    <label class="field-label">车牌号码（不含省份简称）</label>
    <div class="plate-input-wrap">
      <input type="text" id="plate-number" placeholder="如 A12345" maxlength="7" autocomplete="off">
    </div>

    <!-- Energy Type -->
    <label class="field-label">车辆类型</label>
    <div class="energy-types" id="energy-types">
      <button class="energy-btn active" data-type="fuel" onclick="selectEnergy('fuel')">⛽ 燃油车</button>
      <button class="energy-btn" data-type="ev" onclick="selectEnergy('ev')">🔋 纯电动</button>
      <button class="energy-btn" data-type="hybrid" onclick="selectEnergy('hybrid')">⚡ 混动</button>
    </div>

    <!-- Phone -->
    <label class="field-label">车主手机号</label>
    <input type="tel" id="phone-number" placeholder="请输入11位手机号" maxlength="11" autocomplete="off">

    <button class="submit-btn" id="save-btn" onclick="generateQR()">生成挪车二维码</button>
  </div>

  <!-- QR Result Card (hidden until generated) -->
  <div class="card" id="qr-card" style="display:none;">
    <h2>✅ 挪车二维码已生成</h2>

    <!-- Saved info -->
    <div class="saved-info">
      <span class="label">车牌</span>
      <span class="value" id="display-plate"></span>
    </div>
    <div class="saved-info">
      <span class="label">手机号</span>
      <span class="value" id="display-phone"></span>
    </div>

    <!-- QR Code -->
    <div class="qr-area">
      <div class="qr-label">扫一扫，联系车主挪车</div>
      <div id="qrcode"></div>
      <div class="qr-actions">
        <button onclick="copyLink()">📋 复制链接</button>
        <button onclick="downloadQR()">💾 保存图片</button>
        <button onclick="resetForm()">✏️ 修改信息</button>
      </div>
    </div>
  </div>
</div>

<!-- Scanner Mode: Someone scanned the QR code -->
<div id="scanner-section" style="display:none;">
  <div class="scanner-hint">微信扫码<br>呼叫车主</div>
  <div class="scanner-plate" id="scanner-plate"></div>
  <a href="#" id="call-btn" class="scanner-call-btn" onclick="callOwner(event)">📞 一键挪车</a>
</div>

<!-- Scanner Error -->
<div id="scanner-error" class="app" style="display:none;">
  <div class="header">
    <div class="title">🚗 一键挪车</div>
    <button class="back-btn theme-toggle" onclick="toggleTheme()">🌙</button>
  </div>
  <div class="card">
    <div class="empty">
      <span class="big-emoji">😕</span>
      二维码已失效或信息不完整<br>
      <span style="font-size:13px;">请联系车主重新生成</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== CONFIG ====================
const PROVINCES = ['京','沪','粤','川','渝','苏','浙','皖','闽','赣','鲁','豫','鄂','湘','桂','琼','贵','云','藏','陕','甘','青','蒙','宁','新','冀','津','辽','吉','黑'];
const STORAGE_KEY = 'nocar_data';

// ==================== STATE ====================
let selectedProvince = '川';
let selectedEnergy = 'fuel';
let savedData = null;
let qrCodeInstance = null;

// ==================== THEME ====================
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  document.querySelectorAll('.theme-toggle').forEach(el => el.textContent = next === 'dark' ? '☀️' : '🌙');
  localStorage.setItem('nocar-theme', next);
}

(function initTheme() {
  const saved = localStorage.getItem('nocar-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  document.querySelectorAll('.theme-toggle').forEach(el => el.textContent = theme === 'dark' ? '☀️' : '🌙');
})();

// ==================== TOAST ====================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 2500);
}

// ==================== PROVINCE PICKER ====================
function renderProvinceGrid() {
  const grid = document.getElementById('province-grid');
  grid.innerHTML = PROVINCES.map(p =>
    `<button class="province-btn${selectedProvince === p ? ' active' : ''}" onclick="selectProvince('${p}')">${p}</button>`
  ).join('');
}

function selectProvince(p) {
  selectedProvince = p;
  renderProvinceGrid();
}

// ==================== ENERGY TYPE ====================
function selectEnergy(type) {
  selectedEnergy = type;
  document.querySelectorAll('.energy-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.type === type);
  });
}

// ==================== VALIDATION ====================
function validatePlate(number) {
  // 车牌号码部分：字母+数字组合，通常5-6位（新能源6位）
  if (!number) return '请输入车牌号码';
  const upper = number.toUpperCase();
  // 普通车牌：1位字母 + 4位数字字母组合（如 A123B）
  // 新能源：可能6位
  if (upper.length < 5 || upper.length > 7) return '车牌号码长度应为5-7位';
  if (!/^[A-Z0-9]+$/.test(upper)) return '车牌号码只能包含字母和数字';
  return null;
}

function validatePhone(phone) {
  if (!phone) return '请输入手机号';
  if (!/^1[3-9]\d{9}$/.test(phone)) return '请输入正确的手机号';
  return null;
}

// ==================== PHONE MASKING ====================
function maskPhone(phone) {
  if (!phone || phone.length < 7) return phone;
  return phone.slice(0, 3) + '****' + phone.slice(-4);
}

function getFullPlate() {
  const number = document.getElementById('plate-number').value.trim().toUpperCase();
  return selectedProvince + number;
}

// ==================== DATA ENCODING ====================
// Ultra-compact format: provinceIndex(base36) + plate + phone + energyCode
// No separators — phone is always last 11 chars, energy is last char, province is first char
// ~50% shorter URL than original JSON base64
const ENERGY_CODES = ['fuel', 'ev', 'hybrid'];

function encodeData(data) {
  const pi = PROVINCES.indexOf(data.p[0]).toString(36); // 0-9, a-t (single char)
  const plateNum = data.p.slice(1);
  const ec = ENERGY_CODES.indexOf(data.e); // 0, 1, 2
  const compact = pi + plateNum + data.t + ec;
  return btoa(compact).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function decodeData(encoded) {
  try {
    let b64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const decoded = atob(b64);

    // New compact format: pi(1) + plate(5-7) + phone(11) + ec(1) = 18-20 chars
    if (decoded.length >= 18 && decoded.length <= 20) {
      const pi = parseInt(decoded[0], 36);
      const ec = parseInt(decoded[decoded.length - 1], 10);
      const phone = decoded.slice(-12, -1);
      const plateNum = decoded.slice(1, -12);
      if (!isNaN(pi) && pi >= 0 && pi < PROVINCES.length && /^\d{11}$/.test(phone)) {
        return { p: PROVINCES[pi] + plateNum, t: phone, e: ENERGY_CODES[ec] || 'fuel' };
      }
    }

    // Fallback: old comma format "pi,plate,phone,ec"
    const parts = decoded.split(',');
    if (parts.length === 4 && /^\d+$/.test(parts[0])) {
      const pi = parseInt(parts[0], 10);
      if (pi >= 0 && pi < PROVINCES.length) {
        const ec = parseInt(parts[3], 10);
        return { p: PROVINCES[pi] + parts[1], t: parts[2], e: ENERGY_CODES[ec] || 'fuel' };
      }
    }

    // Fallback: original JSON format
    const json = decodeURIComponent(escape(decoded));
    const data = JSON.parse(json);
    return (data && data.p && data.t) ? data : null;
  } catch (e) {
    return null;
  }
}

// ==================== QR CODE GENERATION ====================
function createEnergyLogo(energyType) {
  const emojis = { fuel: '\u{1F697}', ev: '\u{1F50B}', hybrid: '\u26A1' };
  const emoji = emojis[energyType] || emojis.fuel;
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">' +
    '<text x="24" y="26" font-size="34" text-anchor="middle" dominant-baseline="central">' + emoji + '</text></svg>';
  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
}

function generateQR() {
  const plateNumber = document.getElementById('plate-number').value.trim().toUpperCase();
  const phone = document.getElementById('phone-number').value.trim();

  // Validate
  const plateErr = validatePlate(plateNumber);
  if (plateErr) { showToast(plateErr); return; }
  const phoneErr = validatePhone(phone);
  if (phoneErr) { showToast(phoneErr); return; }

  const fullPlate = selectedProvince + plateNumber;
  const data = {
    p: fullPlate,
    t: phone,
    e: selectedEnergy
  };

  savedData = data;

  // Save to localStorage
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

  // Generate QR code with scan URL
  const baseUrl = window.location.origin + window.location.pathname;
  const scanUrl = baseUrl + '?d=' + encodeData(data);

  // Render styled QR code
  const qrContainer = document.getElementById('qrcode');
  qrContainer.innerHTML = '';

  new QRCode(qrContainer, {
    text: scanUrl,
    width: 200,
    height: 200,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.L
  });

  // Display saved info
  document.getElementById('display-plate').innerHTML = `<span class="plate-preview">${fullPlate}</span>`;
  document.getElementById('display-phone').textContent = maskPhone(phone);

  // Show QR card
  document.getElementById('qr-card').style.display = 'block';
  document.getElementById('qr-card').scrollIntoView({ behavior: 'smooth' });

  showToast('二维码已生成 ✅');
}

// ==================== QR ACTIONS ====================
function copyLink() {
  if (!savedData) return;
  const baseUrl = window.location.origin + window.location.pathname;
  const scanUrl = baseUrl + '?d=' + encodeData(savedData);
  navigator.clipboard.writeText(scanUrl).then(() => {
    showToast('链接已复制 📋');
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = scanUrl;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('链接已复制 📋');
  });
}

function downloadQR() {
  const canvas = document.querySelector('#qrcode canvas');
  const img = document.querySelector('#qrcode img');
  let dataUrl;

  if (canvas) {
    dataUrl = canvas.toDataURL('image/png');
  } else if (img) {
    dataUrl = img.src;
  } else {
    showToast('未找到二维码图片');
    return;
  }

  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = `挪车二维码_${savedData.p}.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast('图片已保存 💾');
}

function resetForm() {
  document.getElementById('qr-card').style.display = 'none';
  document.getElementById('plate-number').value = '';
  document.getElementById('phone-number').value = '';
  document.getElementById('plate-number').focus();
}

// ==================== RESTORE SAVED DATA ====================
function restoreSavedData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    savedData = data;
    // Restore province
    if (data.p && data.p.length > 0) {
      selectedProvince = data.p[0];
      renderProvinceGrid();
      const number = data.p.slice(1);
      document.getElementById('plate-number').value = number;
    }
    // Restore phone
    if (data.t) {
      document.getElementById('phone-number').value = data.t;
    }
    // Restore energy type
    if (data.e) {
      selectedEnergy = data.e;
      document.querySelectorAll('.energy-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.type === data.e);
      });
    }
    // Auto-generate QR if data exists
    if (data.p && data.t) {
      generateQR();
    }
  } catch (e) {
    console.warn('Restore saved data failed:', e);
  }
}

// ==================== SCANNER MODE ====================
function getEnergyLabel(type) {
  const map = { fuel: '⛽ 燃油车', ev: '🔋 纯电动', hybrid: '⚡ 混动' };
  return map[type] || '⛽ 燃油车';
}

function showScannerMode(data) {
  document.getElementById('owner-section').style.display = 'none';
  document.getElementById('scanner-error').style.display = 'none';
  document.getElementById('scanner-section').style.display = 'flex';

  // Split plate into province char + alphanumeric for better height alignment
  const plate = data.p;
  const province = plate.slice(0, 1);
  const rest = plate.slice(1);
  document.getElementById('scanner-plate').innerHTML =
    '<span class="plate-province">' + province + '</span>' +
    '<span class="plate-dot">·</span>' +
    '<span class="plate-num">' + rest + '</span>';

  // Set call button href
  const callBtn = document.getElementById('call-btn');
  callBtn.href = 'tel:' + data.t;
}

function callOwner(e) {
  // tel: link handles the actual call
}

// ==================== INIT ====================
(function init() {
  renderProvinceGrid();

  // Check if scanner mode (URL has ?d= parameter)
  const params = new URLSearchParams(window.location.search);
  const encoded = params.get('d');

  if (encoded) {
    // Scanner mode
    const data = decodeData(encoded);
    if (data && data.p && data.t) {
      showScannerMode(data);
    } else {
      // Invalid data
      document.getElementById('owner-section').style.display = 'none';
      document.getElementById('scanner-error').style.display = 'block';
    }
  } else {
    // Owner mode - restore saved data if exists
    restoreSavedData();
  }
})();

// Enter key to submit
document.getElementById('phone-number').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') generateQR();
});
document.getElementById('plate-number').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('phone-number').focus();
});

// Auto-uppercase plate input
document.getElementById('plate-number').addEventListener('input', (e) => {
  e.target.value = e.target.value.toUpperCase();
});

// Only allow digits in phone input
document.getElementById('phone-number').addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/\D/g, '');
});
</script>
